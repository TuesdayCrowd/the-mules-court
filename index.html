<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>The Mule's Court</title>
</head>

<body>
    <main id="app">
        <!-- The table, and the transient layer the cinematic beats draw into.
             Both are populated by src/main.ts; this element used to hold the
             Phaser canvas. -->
        <div id="game-container"></div>
        <!-- The chrome layer (UIX §2). Above the table, pointer-events:none at
             the root; interactive children restore auto, so the two layers never
             fight for the same tap. Anchored to the viewport, never to a table
             coordinate — the layers share design tokens, not geometry.

             The offscreen accessibility twin that used to sit beside this is
             gone. It existed to give a screen reader focusable proxies for cards
             painted onto a canvas; the cards are real buttons now, so the proxy
             and the thing it proxied are one object, and keeping both would have
             announced every seat twice. -->
        <div id="ui-root"></div>
    </main>
    <!-- No <link rel="stylesheet"> here: src/main.ts imports the stylesheets so
         Vite bundles and fingerprints them. -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
